name: Apply shared storage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-shared-storage.yml'
      - 'scripts/apply-shared-storage.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply-shared-storage.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git status
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "feat(shared): save/load GEDCOM via baobab localStorage"
          git push origin HEAD:main
