name: Baobab autoload

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/baobab-autoload.yml'
      - 'scripts/add-baobab-autoload.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-baobab-autoload.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(shared): auto-load into A when ?baobab=shared"
          git push origin HEAD:main
