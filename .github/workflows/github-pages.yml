name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore Vite entry before build
        run: cp index.vite.html index.html

      - name: Build
        run: npm run build
        env:
          BASE_URL: ./

      - name: Publish to main root + docs
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

          cp dist/index.html index.html
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          touch .nojekyll

          rm -rf docs
          mkdir -p docs
          cp -R dist/. docs/
          touch docs/.nojekyll

          # Keep source entry for next CI builds
          test -f index.vite.html

          git add index.html index.vite.html assets docs .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "build: production site on main (root + docs) for GitHub Pages"
          git push origin HEAD:main
